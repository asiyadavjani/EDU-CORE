<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; }
        #authLoading {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; color: #555; font-size: 14px;
        }
        #pageContent { display: none; padding: 24px; }
    </style>
</head>
<body>
    <!-- Shown immediately; swapped out once the role check below passes.
         This is what stops a Teacher/Admin from ever seeing a flash of
         this page's real content before getting redirected away. -->
    <div id="authLoading">Checking access…</div>

    <div id="pageContent">
        <h1>student</h1>
    </div>

    <script type="module">
        // NOTE: this file lives in /student/, authGuard.js lives one folder
        // up at the project root — hence "../authGuard.js", not "./authGuard.js".
        import { protectPage } from "../authGuard.js";
        // Sirf Student access kar sakta hai
        protectPage(["Student"], { loadingEl: "authLoading", contentEl: "pageContent" });
    </script>
</body>
</html>
