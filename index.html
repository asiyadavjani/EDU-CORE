<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduCore Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<!-- header    first -->


<!-- ===========================
      TOP ANNOUNCEMENT BAR
=========================== -->

<div class="announcement-bar" id="topBar">

    <div class="announcement-content">

        <div class="announcement-left">

            <span class="offer-badge">
                🔥 Admissions Open
            </span>

            <span class="offer-text">
                New Web Development, Digital Marketing & AI batches are now live.
            </span>

        </div>

        <a href="./enrollment.html" class="offer-btn">

            Take Eligibility Quiz

            <i class="fa-solid fa-arrow-right"></i>

        </a>

    </div>

    <button class="close-btn" onclick="closeBar()">

        <i class="fa-solid fa-xmark"></i>

    </button>

</div>


<!-- header frst close -->



<!-- header -->
<div id="header-placeholder"></div>

<!-- header -->

















<!-- ====================================
      FLOATING SIDEBAR NAVIGATION 
===================================== -->
<div class="side-floating-bar">

  <!-- Phone Contact -->
  <a href="tel:03200918060" class="side-item">
    <i class="fa-solid fa-phone"></i>
    <span class="side-tooltip">03200918060</span>
  </a>

  <!-- Email Support -->
  <a href="mailto:support@educore.com" class="side-item">
    <i class="fa-solid fa-envelope"></i>
    <span class="side-tooltip">@educore</span>
  </a>

  <!-- Quick FAQ / Page Link -->
  <a href="./faq.html" class="side-item accent-item">
    <i class="fa-solid fa-circle-question"></i>
    <span class="side-tooltip">FAQs</span>
  </a>

</div>
<!-- ====================================
      FLOATING SIDEBAR NAVIGATION 
===================================== -->





















    <!-- /////////////////////nav end//////////////////////// -->

<div class="page-container">

    <section class="hero-slider">
        <div class="slider-container">
            <div class="slider-content">
                <h1 class="animate-text-left">40% off your first 3 months. Learn more for less.</h1>
                <p class="animate-text-bottom">Personal Plan is your career companion for AI and more cutting-edge skills.</p>
                <div class="slider-actions animate-fade">
                    <button class="slider-btn-primary">Get Started</button>
                    <button class="slider-btn-secondary" onclick="openResultModal()">Take Quiz First</button>
                </div>
            </div>

            <div class="slider-graphics-pure">
                
                <div class="circles-group">
                    <div class="pure-circle c-light"></div>
                    <div class="pure-circle c-teal"></div>
                    <div class="pure-circle c-blue-grey"></div>
                    <div class="pure-circle c-dark-grey"></div>
                </div>

                <div class="asterisk-shape">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>

                <div class="staircase-arrow">
                    <svg width="150" height="150" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M150 10V50H110V90H70V130H30V170" stroke="#718096" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M15 155L30 170L45 155" stroke="#718096" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>

                <div class="triangles-mosaic">
                    <div class="tr-sharp color-1"></div>
                    <div class="tr-sharp color-2"></div>
                    <div class="tr-sharp color-3"></div>
                    <div class="tr-sharp color-4"></div>
                    <div class="tr-sharp color-2"></div>
                    <div class="tr-sharp color-3"></div>
                    <div class="tr-sharp color-4"></div>
                    <div class="tr-sharp color-1"></div>
                    <div class="tr-sharp color-3"></div>
                    <div class="tr-sharp color-4"></div>
                    <div class="tr-sharp color-1"></div>
                    <div class="tr-sharp color-2"></div>
                </div>

            </div>
        </div>
    </section>

</div>



    <!-- ///////////////////////slider end//////////////////// -->











































<!-- footer -->
 <div id="footer-placeholder"></div>
 <!-- footer -->



    <!-- JavaScript-->
    <script src="./app.js"></script>
</body>
</html>
